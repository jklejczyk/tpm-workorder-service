spring:
  application:
    name: tpm-workorder-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/workorder_db}
    username: ${SPRING_DATASOURCE_USERNAME:workorder_user}
    password: ${SPRING_DATASOURCE_PASSWORD:workorder}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5674}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${TPM_JWT_PUBLIC_KEY_LOCATION:file:../tpm-platform/keys/public.pem}

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health