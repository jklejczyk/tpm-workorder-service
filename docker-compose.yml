services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workorder_db
      POSTGRES_USER: workorder_user
      POSTGRES_PASSWORD: workorder
    ports: [ "5433:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U workorder_user -d workorder_db" ]
      interval: 5s
      retries: 10
    rabbit:
      image: rabbitmq:4-management-alpine
      ports: [ "5674:5672", "15674:15672" ]
      healthcheck:
        test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
        interval: 5s
        retries: 10

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/workorder_db
      SPRING_DATASOURCE_USERNAME: workorder_user
      SPRING_DATASOURCE_PASSWORD: workorder
      SPRING_RABBITMQ_HOST: rabbit
      SPRING_RABBITMQ_PORT: 5672
    ports: [ "8082:8080" ]
    depends_on:
      db:
        condition: service_healthy