services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workorder_db
      POSTGRES_USER: workorder_user
      POSTGRES_PASSWORD: workorder
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workorder_user -d workorder_db"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/workorder_db
      SPRING_DATASOURCE_USERNAME: workorder_user
      SPRING_DATASOURCE_PASSWORD: workorder
    ports: ["8082:8080"]
    depends_on:
      db:
        condition: service_healthy